name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Real Electron HUD smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libdrm2 libpango-1.0-0 libcairo2
          xvfb-run -a npm run smoke:hud -- --no-sandbox
      - name: Upload HUD smoke failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hud-smoke-failure
          path: hud-smoke-failure.json
          if-no-files-found: ignore
