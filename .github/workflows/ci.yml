name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Real Electron HUD smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run smoke:hud
